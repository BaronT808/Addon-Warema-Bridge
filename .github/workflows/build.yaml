name: Build app images

# Builds the app image for every architecture and pushes it to
# ghcr.io/<owner>/<arch>-addon-warema-bridge:<version> (+ :latest).
# Runs on every push to main that touches the app, and manually.

on:
  push:
    branches: [main]
    paths:
      - "warema-bridge/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "warema-bridge/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version and base image
        id: info
        run: |
          version=$(yq -r '.version' warema-bridge/config.yaml)
          base=$(yq -r ".build_from.${{ matrix.arch }}" warema-bridge/build.yaml)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.arch }}-addon-warema-bridge" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: warema-bridge
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_FROM=${{ steps.info.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
